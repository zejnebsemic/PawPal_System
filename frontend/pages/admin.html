<div class="container-fluid py-4">

    <h2 class="mb-4"><i class="bi bi-speedometer2 me-2"></i>Admin Dashboard</h2>

    <ul class="nav nav-tabs mb-4" id="adminTabs" role="tablist">
        <li class="nav-item">
            <button class="nav-link active" id="pets-tab" data-bs-toggle="tab" data-bs-target="#pets-pane" type="button">Pets</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" id="shelters-tab" data-bs-toggle="tab" data-bs-target="#shelters-pane" type="button">Shelters</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" id="reviews-tab" data-bs-toggle="tab" data-bs-target="#reviews-pane" type="button">Reviews</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" id="requests-tab" data-bs-toggle="tab" data-bs-target="#requests-pane" type="button">Adoption Requests</button>
        </li>
    </ul>

    <div class="tab-content">
        <div class="tab-pane fade show active" id="pets-pane">
            <div class="d-flex justify-content-between mb-3">
                <h4>Manage Pets</h4>
                <button class="btn btn-primary" onclick="PetService.openAddModal()">Add Pet</button>
            </div>
            <table id="pets-table" class="table table-striped w-100"></table>
        </div>

        <div class="tab-pane fade" id="shelters-pane">
            <div class="d-flex justify-content-between mb-3">
                <h4>Manage Shelters</h4>
                <button class="btn btn-primary" onclick="ShelterService.openAddModal()">Add Shelter</button>
            </div>
            <table id="shelters-table" class="table table-striped w-100"></table>
        </div>

        <div class="tab-pane fade" id="reviews-pane">
            <div class="d-flex justify-content-between mb-3">
                <h4>Manage Reviews</h4>
            </div>
            <table id="reviews-table" class="table table-striped w-100"></table>
        </div>

        <div class="tab-pane fade" id="requests-pane">
            <div class="d-flex justify-content-between mb-3">
                <h4>Manage Adoption Requests</h4>
            </div>
            <table id="requests-table" class="table table-striped w-100"></table>
        </div>
    </div>
</div>



<div class="modal fade" id="addPetModal">
    <div class="modal-dialog">
        <form id="addPetForm" class="modal-content">
            <div class="modal-header"><h5>Add Pet</h5></div>
            <div class="modal-body">
                <input name="name" class="form-control mb-2" placeholder="Name" required>
                <input name="type" class="form-control mb-2" placeholder="dog/cat/other" required>
                <input name="age" class="form-control mb-2" placeholder="Age" required>
                <input name="size" class="form-control mb-2" placeholder="small/medium/large" required>
                <input name="gender" class="form-control mb-2" placeholder="male/female" required>
                <input name="availability" class="form-control mb-2" placeholder="available/pending/adopted" required>
                <input name="shelter_id" class="form-control mb-2" placeholder="Shelter ID" required>
                <input name="image_url" class="form-control mb-2" placeholder="Image URL">
                <textarea name="about" class="form-control mb-2" placeholder="About"></textarea>
                <textarea name="characteristics" class="form-control mb-2" placeholder="Characteristics"></textarea>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="PetService.closeModal()">Cancel</button>
                <button type="submit" class="btn btn-primary">Add</button>
            </div>
        </form>
    </div>
</div>


<div class="modal fade" id="editPetModal">
    <div class="modal-dialog">
        <form id="editPetForm" class="modal-content">
            <input type="hidden" id="edit_pet_id" name="pet_id">
            <div class="modal-header"><h5>Edit Pet</h5></div>
            <div class="modal-body">
                <input id="edit_name" name="name" class="form-control mb-2" required>
                <input id="edit_type" name="type" class="form-control mb-2" required>
                <input id="edit_age" name="age" class="form-control mb-2" required>
                <input id="edit_size" name="size" class="form-control mb-2" required>
                <input id="edit_gender" name="gender" class="form-control mb-2" required>
                <input id="edit_availability" name="availability" class="form-control mb-2" required>
                <input id="edit_shelter_id" name="shelter_id" class="form-control mb-2" required>
                <input id="edit_image_url" name="image_url" class="form-control mb-2">
                <textarea id="edit_about" name="about" class="form-control mb-2"></textarea>
                <textarea id="edit_characteristics" name="characteristics" class="form-control mb-2"></textarea>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="PetService.closeModal()">Cancel</button>
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>
    </div>
</div>


<div class="modal fade" id="deletePetModal">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5>Delete Pet</h5></div>
            <div class="modal-body" id="delete_pet_body"></div>
            <input type="hidden" id="delete_pet_id">
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="PetService.closeModal()">Cancel</button>
                <button class="btn btn-danger" onclick="PetService.deletePet()">Delete</button>
            </div>
        </div>
    </div>
</div>


<div class="modal fade" id="addShelterModal">
    <div class="modal-dialog">
        <form id="addShelterForm" class="modal-content">
            <div class="modal-header"><h5>Add Shelter</h5></div>
            <div class="modal-body">
                <input name="name" class="form-control mb-2" placeholder="Name" required>
                <input name="address" class="form-control mb-2" placeholder="Address" required>
                <input name="phone" class="form-control mb-2" placeholder="Phone" required>
                <input name="working_days" class="form-control mb-2" placeholder="Working Days">
                <input name="working_hours" class="form-control mb-2" placeholder="Working Hours">
                <input name="admin_id" class="form-control mb-2" placeholder="Admin ID">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="ShelterService.closeModal()">Cancel</button>
                <button type="submit" class="btn btn-primary">Add</button>
            </div>
        </form>
    </div>
</div>


<div class="modal fade" id="editShelterModal">
    <div class="modal-dialog">
        <form id="editShelterForm" class="modal-content">
            <input type="hidden" id="edit_shelter_id" name="shelter_id">
            <div class="modal-header"><h5>Edit Shelter</h5></div>
            <div class="modal-body">
                <input id="edit_shelter_name" name="name" class="form-control mb-2">
                <input id="edit_shelter_address" name="address" class="form-control mb-2">
                <input id="edit_shelter_phone" name="phone" class="form-control mb-2">
                <input id="edit_shelter_days" name="working_days" class="form-control mb-2">
                <input id="edit_shelter_hours" name="working_hours" class="form-control mb-2">
                <input id="edit_shelter_admin" name="admin_id" class="form-control mb-2">
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="ShelterService.closeModal()">Cancel</button>
                <button class="btn btn-primary">Save</button>
            </div>
        </form>
    </div>
</div>


<div class="modal fade" id="deleteShelterModal">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5>Delete Shelter</h5></div>
            <div class="modal-body" id="delete_shelter_body"></div>
            <input type="hidden" id="delete_shelter_id">
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="ShelterService.closeModal()">Cancel</button>
                <button class="btn btn-danger" onclick="ShelterService.deleteShelter()">Delete</button>
            </div>
        </div>
    </div>
</div>


<div class="modal fade" id="deleteReviewModal">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5>Delete Review</h5></div>
            <div class="modal-body" id="delete_review_body"></div>
            <input type="hidden" id="delete_review_id">
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="ReviewService.closeModal()">Cancel</button>
                <button class="btn btn-danger" onclick="ReviewService.deleteReview()">Delete</button>
            </div>
        </div>
    </div>
</div>


<div class="modal fade" id="processRequestModal">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5>Process Adoption Request</h5></div>
            <div class="modal-body" id="process_request_body"></div>
            <input type="hidden" id="process_request_id">
            <div class="modal-footer">
                <button class="btn btn-warning" onclick="AdoptionRequestService.reject()">Reject</button>
                <button class="btn btn-success" onclick="AdoptionRequestService.approve()">Approve</button>
            </div>
        </div>
    </div>
</div>
