<div class="container py-5">

    <div class="mb-5">
        <h1 class="display-4 fw-bold mb-3">My Adoption Requests</h1>
        <p class="lead text-muted">Track your adoption applications and their status</p>
    </div>

    <div class="row g-4 mb-5">
        <div class="col-md-3">
            <div class="stat-card">
                <h3 class="fw-bold mb-0">0</h3>
                <small class="text-muted">Total Requests</small>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card">
                <h3 class="fw-bold mb-0">0</h3>
                <small class="text-muted">Pending</small>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card">
                <h3 class="fw-bold mb-0">0</h3>
                <small class="text-muted">Approved</small>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card">
                <h3 class="fw-bold mb-0">0</h3>
                <small class="text-muted">Rejected</small>
            </div>
        </div>
    </div>

    <div id="requests-container"></div>

    <div class="text-center py-5 d-none" id="empty-state">
        <i class="bi bi-inbox text-muted" style="font-size: 5rem;"></i>
        <h3 class="mt-4 mb-3">No Adoption Requests Yet</h3>
        <p class="text-muted mb-4">Start your adoption journey by browsing available pets</p>
        <a href="#" data-page="browse" class="btn btn-primary">
            Browse Pets <i class="bi bi-arrow-right ms-2"></i>
        </a>
    </div>

</div>
