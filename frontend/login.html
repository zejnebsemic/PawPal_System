<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PawFinder | Login / Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/toastr@2.1.4/build/toastr.min.css" rel="stylesheet">

    <style>
        body { background-color: #f5f6fa; }
        .auth-card {
            background: #fff;
            border-radius: 15px;
            padding: 35px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .paw-icon { font-size: 3.5rem; color: #ff6f61; }
        .btn-auth {
            background-color: #ff6f61;
            border: none;
        }
        .btn-auth:hover { background-color: #e65b50; }
        .toggle-link { cursor: pointer; color: #ff6f61; }
    </style>
</head>

<body>

<div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="col-md-5 col-lg-4">

        <div class="auth-card">

            <div class="text-center mb-4">
                <i class="bi bi-heart-fill paw-icon"></i>
                <h3 id="form-title" class="mt-2">Welcome Back</h3>
                <p id="form-subtitle" class="text-muted">Login to continue</p>
            </div>

            <form id="login-form">

                <div class="mb-3">
                    <label>Email</label>
                    <input type="email" name="email" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label>Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>

                <button class="btn btn-auth text-white w-100">Login</button>
            </form>

            <form id="register-form" style="display:none;">

                <div class="mb-3">
                    <label>Full Name</label>
                    <input type="text" name="name" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label>Email</label>
                    <input type="email" name="email" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label>Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>

                <button class="btn btn-auth text-white w-100">Create Account</button>
            </form>

            <div class="text-center mt-3">
                <span id="toggle-text">Don't have an account?</span>
                <span id="toggle-btn" class="toggle-link fw-bold">Register</span>
            </div>

            <div class="text-center mt-3">
                <a href="index.html" class="text-decoration-none text-muted">
                    ← Back to Home
                </a>
            </div>

        </div>
    </div>
</div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.19.5/jquery.validate.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/toastr@2.1.4/build/toastr.min.js"></script>

<script src="utils/constants.js"></script>
<script src="utils/rest-client.js"></script>

<script>
$("#toggle-btn").click(function () {
    $("#login-form, #register-form").toggle();

    if ($("#login-form").is(":visible")) {
        $("#form-title").text("Welcome Back");
        $("#form-subtitle").text("Login to continue");
        $("#toggle-text").text("Don't have an account?");
        $("#toggle-btn").text("Register");
    } else {
        $("#form-title").text("Create Account");
        $("#form-subtitle").text("Register as a user");
        $("#toggle-text").text("Already have an account?");
        $("#toggle-btn").text("Login");
    }
});

$("#login-form").validate({
    submitHandler: function (form) {
        let data = Object.fromEntries(new FormData(form).entries());

        RestClient.post("auth/login", JSON.stringify(data),
            function (res) {
                localStorage.setItem("user_token", res.data.token);
                localStorage.setItem("user_data", JSON.stringify(res.data));
                toastr.success("Login successful");
                window.location.href = "index.html";
            },
            function (err) {
                toastr.error(err.responseJSON?.error || "Login failed");
            }
        );
    }
});

$("#register-form").validate({
    submitHandler: function (form) {
        let data = Object.fromEntries(new FormData(form).entries());
        data.role = "user"; 

        RestClient.post("auth/register", JSON.stringify(data),
            function () {
                toastr.success("Account created! You can now login.");
                $("#toggle-btn").click(); 
                form.reset();
            },
            function (err) {
                toastr.error(err.responseJSON?.error || "Registration failed");
            }
        );
    }
});
</script>

</body>
</html>
